# ─────────────────────────────────────────────────────────────────────────────
# SWARM-X  |  docker-compose.yml
#
# Services:
#   pi_robot  — Full robot stack: motors, obstacle avoidance, sensors
#   rplidar   — RPLidar A1 driver (separate container for USB isolation)
#
# Run on the Pi:
#   ROS_DOMAIN_ID=42 docker compose up
#
# Run on the Laptop (same Wi-Fi, same ROS_DOMAIN_ID):
#   ROS_DOMAIN_ID=42 ros2 topic echo /scan
#
# NOTE: rplidar uses /dev/rplidar (udev symlink). Create the rule with:
#   echo 'SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", SYMLINK+="rplidar"' \
#     | sudo tee /etc/udev/rules.d/99-rplidar.rules
#   sudo udevadm control --reload-rules && sudo udevadm trigger
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Robot brain (motor controller + obstacle avoider + sensors) ─────────────
  pi_robot:
    build:
      context: .
      dockerfile: docker/pi/Dockerfile
    image: swarmx/pi_robot:humble
    container_name: swarmx_pi_robot

    # HOST networking is REQUIRED so ROS 2 DDS multicast can reach the laptop
    network_mode: host

    # Privileged mode grants /dev/gpiomem and I2C access
    privileged: true

    devices:
      # GPIO memory for L298N motor control
      - /dev/gpiomem:/dev/gpiomem
      # I2C bus for MLX90614, MPU6050, ADS1115
      - /dev/i2c-1:/dev/i2c-1
      # ESP32 serial for micro-ROS (HC-SR04)
      - /dev/ttyUSB0:/dev/ttyUSB0

    volumes:
      # Mount the workspace source for live code edits (remove in production)
      - ./src:/ros2_ws/src:ro

    environment:
      # Shared domain — Pi and Laptop MUST use the same value
      - ROS_DOMAIN_ID=42
      # FastDDS SHM config (set in Dockerfile but explicit here too)
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/fastrtps/fastdds.xml
      # Disable GUI (headless Pi)
      - DISPLAY=""

    # Raise shared-memory size limit to avoid FastDDS OOM on 2 GB Pi
    shm_size: "128mb"

    restart: unless-stopped

    command: >
      ros2 launch my_robot master.launch.py

  # ── RPLidar A1 standalone driver ───────────────────────────────────────────
  rplidar:
    image: swarmx/pi_robot:humble
    container_name: swarmx_rplidar
    network_mode: host
    privileged: true

    devices:
      # Use udev symlink — NOT ttyUSB0 (avoids conflict with ESP32)
      - /dev/rplidar:/dev/rplidar

    environment:
      - ROS_DOMAIN_ID=42
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/fastrtps/fastdds.xml

    shm_size: "64mb"

    restart: unless-stopped

    command: >
      ros2 launch rplidar_ros rplidar_launch.py
      serial_port:=/dev/rplidar
      frame_id:=laser

    depends_on:
      - pi_robot
