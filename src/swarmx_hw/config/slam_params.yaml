# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  SWARM-X slam_toolbox Configuration
#  For use on the LAPTOP (workstation), not the Pi.
#
#  Launch with:
#    ros2 launch slam_toolbox online_async_launch.py \
#      slam_params_file:=/path/to/this/slam_params.yaml \
#      use_sim_time:=false
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

slam_toolbox:
  ros__parameters:

    # ── Solver & Mode ─────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── SLAM Mode ─────────────────────────────────────────────────────
    mode: mapping    # 'mapping' for initial map creation, 'localization' for Nav2

    # ── Input Topics ──────────────────────────────────────────────────
    # These must match the Pi's namespaced topics
    scan_topic: /robot1/scan
    odom_frame: odom
    map_frame: map
    base_frame: robot1/base_link

    # ── Timing ────────────────────────────────────────────────────────
    use_sim_time: false
    transform_publish_period: 0.05       # 20 Hz tf publish rate
    map_update_interval: 3.0             # Seconds between map updates (save CPU)
    resolution: 0.05                     # 5 cm grid resolution

    # ── Scan Processing ───────────────────────────────────────────────
    max_laser_range: 12.0                # RPLidar A1 max: 12 m
    minimum_time_interval: 0.5           # Minimum seconds between scans processed
    transform_timeout: 0.2

    # ── Scan Matching ─────────────────────────────────────────────────
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3         # Move 30 cm before new scan match
    minimum_travel_heading: 0.3          # Rotate 0.3 rad before new scan match

    # ── Loop Closure ──────────────────────────────────────────────────
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Correlation (Scan Matching) ───────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ── Loop Closure Search ───────────────────────────────────────────
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0

    # ── Scan Matcher Tuning ───────────────────────────────────────────
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349    # ~0.2 deg
    coarse_search_angle_offset: 0.349    # ~20 deg
    coarse_angle_resolution: 0.0349      # ~2 deg
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ── Stack Size (for large maps) ───────────────────────────────────
    stack_size_to_use: 40000000          # 40 MB
